name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행도 가능하게 한다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 정적 사이트 빌드
        run: npm run build
        env:
          # 저장소 하위 경로(/breakeout)를 basePath 로 적용한다
          GITHUB_PAGES: "true"
          # Settings > Secrets and variables > Actions > Variables 에 등록한다.
          # anon key 는 원래 공개용이라 secret 이 아닌 variable 로 둔다.
          # 비어 있으면 Supabase 없이 localStorage 만으로 동작한다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 저장소의 Pages 설정을 읽어온다.
      # Settings > Pages > Source 가 "GitHub Actions" 여야 한다.
      # (워크플로 토큰으로는 Pages 사이트를 생성할 수 없어 최초 1회는 수동 설정이 필요하다)
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
